name: NIFTY 50 Daily EOD Movement Prediction

on:
  schedule:
    # Runs Monday to Friday at 11:00 UTC (16:30 IST - 1 hour after NSE cash market close)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Needed to commit and push updated data, models, and reports

jobs:
  run-eod-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run EOD Data Collection, Dual Model Retraining & Forecasting
        run: |
          python run_pipeline.py

      - name: 📝 Post Daily Executive Summary to GitHub Actions Run
        run: |
          if [ -f reports/latest_summary.md ]; then
            cat reports/latest_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Commit and Push Updated Data, Models, and Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated artifacts
          git add data/ models/ reports/
          
          # Commit only if changes exist
          if git diff --staged --quiet; then
            echo "No new market data or model changes to commit."
          else
            LATEST_DATE=$(date +'%Y-%m-%d')
            git commit -m "🤖 Auto-Update: EOD Observations & Next Day Prediction [${LATEST_DATE}] [skip ci]"
            git push
          fi
